model:
  class_path: modules.MimiResynthesisV2BottleneckModule
  init_args:
    seanet_args:
      channels: 1
      dimension: 512
      causal: true
      n_filters: 64
      n_residual_layers: 1
      activation: "ELU"
      compress: 2
      dilation_base: 2
      disable_norm_outer_blocks: 0
      kernel_size: 7
      residual_kernel_size: 3
      last_kernel_size: 3
      norm: "none"
      pad_mode: "constant"
      ratios: [8, 5, 4, 2]
      true_skip: true
      look_ahead: false
      look_ahead_size: 0
    transformer_args:
      d_model: 512
      num_heads: 8
      num_layers: 8
      causal: true
      layer_scale: 0.01
      context: 100
      right_context: 4
      conv_layout: true
      max_period: 10000
      gating: "none"
      norm: "layer_norm"
      positional_embedding: "rope"
      dim_feedforward: 2048
      input_dimension: 512
      output_dimensions: [512]
    bottleneck_dim: 8
    sample_rate: 16000
    frame_rate: 50
    num_codes: 200
    encoder_dim: 512
    decoder_seanet_args:
      channels: 1
      dimension: 512
      causal: true
      n_filters: 64
      n_residual_layers: 1
      activation: "ELU"
      compress: 2
      dilation_base: 2
      disable_norm_outer_blocks: 0
      kernel_size: 7
      residual_kernel_size: 3
      last_kernel_size: 3
      norm: "weight_norm"
      pad_mode: "constant"
      ratios: [8, 5, 4, 2]
      true_skip: true
    frame_synthesizer_args:
      d_model: 512
      num_heads: 8
      causal: true
      layer_scale: 0.01
      context: 100
      right_context: 0
      conv_layout: true
      max_period: 10000
      gating: "none"
      norm: "layer_norm"
      positional_embedding: "rope"
      dim_feedforward: 2048
      input_dimension: 8
      output_dimension: 512
      timbre_dimension: 704
      timbre_cond_dim: 192
      b1_layers: 3
      b2_layers: 3
      b3_layers: 2
    use_tv_timbre: false
    lambdas:
      mel_loss: 20.0
      adv_feat_loss: 2.0
      adv_gen_loss: 1.0
      ped_loss: 20.0
      hubert_loss: 15.0
      speaker_loss: 10.0
    learning_rate: 0.0001
    lr_betas: [0.8, 0.99]
    lr_sch_gamma: 0.999996
    encoder_path: /data/waris/code/DarkStreamExt/logs/darkstream/mimipasrv2withbottleneck_la4/checkpoints/epoch=34-val_acc=0.7875.ckpt
    decoder_pretrained: false
    decoder_path: null
    hubert_ckpt: null
trainer:
  # Train, Validate, Test and Predict
  # Device https://lightning.ai/docs/pytorch/stable/common/trainer.html#accelerator
  accelerator: gpu # "cpu", "gpu", "tpu", "ipu", "auto"
  devices: "1," # "2," for device id 2
  num_nodes: 1 # https://lightning.ai/docs/pytorch/stable/common/trainer.html#num-nodes
  max_epochs: 100