model:
  class_path: modules.SupervisedWav2WavModule
  init_args:
    encoder_frontend_type: hybrid_stem_mel_transformer
    seanet_args:
      channels: 1
      dimension: 512
      causal: true
    encoder_frontend_args:
      sample_rate: 16000
      n_fft: 1024
      win_length: 1024
      hop_length: 320
      n_mels: 128
      dimension: 512
      mel_projection_type: linear
      hybrid_raw_frame_samples: 320
      hybrid_raw_dim: 512
      hybrid_raw_conv_layers: 1
      hybrid_raw_conv_kernel_size: 3
      hybrid_raw_use_depthwise: true
      hybrid_fusion_type: concat
    transformer_args:
      d_model: 512
      num_heads: 8
      num_layers: 8
      causal: true
      layer_scale: 0.01
      context: 100
      right_context: 4
      conv_layout: true
      max_period: 10000
      gating: none
      norm: layer_norm
      positional_embedding: rope
      dim_feedforward: 2048
      input_dimension: 512
      output_dimensions: [512]
    decoder_type: istft
    decoder_seanet_args:
      channels: 1
      dimension: 512
      causal: true
    waveform_decoder_args:
      input_dimension: 512
      frame_hop_samples: 320
      decoder_dim: 512
      decoder_layers: 4
      decoder_heads: 8
      decoder_ffn_dim: 2048
      decoder_context_frames: 100
      decoder_right_context_frames: 4
      activation: SiLU
      linear_hidden_dim: 1024
      istft_n_fft: 1024
      istft_hop_length: 320
      istft_win_length: 1024
      istft_predict: complex
      istft_center: false
    sample_rate: 16000
    frame_rate: 50
    lambdas:
      mel_loss: 20.0
      adv_gen_loss: 1.0
      adv_feat_loss: 2.0
      hubert_loss: 0.0
    hubert_loss_args:
      model_name_or_path: facebook/hubert-base-ls960
      feature_layer: null
      loss_type: mse
      normalize_waveform: false
      local_files_only: false
      revision: null
    discriminator_args:
      rates: []
      periods: [2, 3, 5, 7, 11]
      fft_sizes: [2048, 1024, 512]
    learning_rate: 0.0001
    lr_betas: [0.8, 0.99]
    lr_sch_gamma: 0.999996
    validation_audio_samples: 4
trainer:
  accelerator: gpu
  devices: "0,1,2,3"
  num_nodes: 1
  max_epochs: 20
  strategy: ddp_find_unused_parameters_true
  val_check_interval: 0.25
  precision: bf16-mixed
