model:
  class_path: modules.SupervisedWav2WavModule
  init_args:
    encoder_frontend_type: seanet
    seanet_args:
      channels: 1
      dimension: 512
      causal: true
      n_filters: 64
      n_residual_layers: 1
      activation: ELU
      compress: 2
      dilation_base: 2
      disable_norm_outer_blocks: 0
      kernel_size: 7
      residual_kernel_size: 3
      last_kernel_size: 3
      norm: none
      pad_mode: constant
      ratios: [8, 5, 4, 2]
      true_skip: true
      look_ahead: false
      look_ahead_size: 0
    encoder_frontend_args:
      sample_rate: 16000
      n_fft: 1024
      win_length: 1024
      hop_length: 320
      n_mels: 80
      dimension: 512
    transformer_args:
      d_model: 512
      num_heads: 8
      num_layers: 8
      causal: true
      layer_scale: 0.01
      context: 100
      right_context: 0
      conv_layout: true
      max_period: 10000
      gating: none
      norm: layer_norm
      positional_embedding: rope
      dim_feedforward: 2048
      input_dimension: 512
      output_dimensions: [512]
    decoder_type: seanet
    decoder_seanet_args:
      channels: 1
      dimension: 512
      causal: true
      n_filters: 64
      n_residual_layers: 1
      activation: ELU
      compress: 2
      dilation_base: 2
      disable_norm_outer_blocks: 0
      kernel_size: 7
      residual_kernel_size: 3
      last_kernel_size: 3
      norm: weight_norm
      pad_mode: constant
      ratios: [8, 5, 4, 2]
      true_skip: true
    waveform_decoder_args:
      input_dimension: 512
      frame_hop_samples: 320
      decoder_dim: 512
    sample_rate: 16000
    frame_rate: 50
    lambdas:
      mel_loss: 20.0
      adv_gen_loss: 1.0
      adv_feat_loss: 2.0
      hubert_loss: 0.0
    hubert_loss_args:
      model_name_or_path: facebook/hubert-base-ls960
      feature_layer: null
      loss_type: mse
      normalize_waveform: false
      local_files_only: false
      revision: null
    discriminator_args:
      rates: []
      periods: [2, 3, 5, 7, 11]
      fft_sizes: [2048, 1024, 512]
    learning_rate: 0.0001
    lr_betas: [0.8, 0.99]
    lr_sch_gamma: 0.999996
    validation_audio_samples: 4
trainer:
  accelerator: gpu
  devices: "0,1,2,3"
  num_nodes: 1
  max_epochs: 20
  strategy: ddp_find_unused_parameters_true
  val_check_interval: 0.25
  precision: bf16-mixed
